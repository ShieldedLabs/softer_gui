# Static, cross-distro Linux binary by default. musl's Rust std links crt-static
# on its own; the flag is here so a gnu-target build with `--target` overridden
# still tries (glibc static is a fallback, not the goal: NSS/dlopen break there).
[build]
target = "x86_64-unknown-linux-musl"

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
